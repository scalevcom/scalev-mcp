name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalev-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scalev-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: scalev-mcp

      - name: Checkout api-openapi
        uses: actions/checkout@v5
        with:
          repository: scalevcom/api-openapi
          ref: main
          path: api-openapi

      - name: Checkout docs
        uses: actions/checkout@v5
        with:
          repository: scalevcom/docs
          ref: main
          path: docs

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scalev-mcp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catalogs are deterministic outputs of the sibling api-openapi
      # and docs repos. If sibling repos changed since the last in-tree
      # catalog commit, we regenerate here so the deploy reflects the
      # latest API and docs surface. The same run that detects drift
      # ALSO validates, deploys, and persists the regenerated catalog
      # back to main — never skips the deploy step.
      - name: Regenerate catalogs from sibling sources
        run: pnpm run generate:catalogs

      - name: Detect catalog drift
        id: drift
        run: |
          if git diff --quiet -- src/generated/v3Catalog.ts src/generated/docsCatalog.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Generated catalogs were stale; deploying regenerated catalog and persisting it back to main."
          fi

      - name: Check submission text safety
        run: pnpm run check:submission-text

      - name: Check submission package
        run: pnpm run check:submission-package

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Load Cloudflare deploy secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://scalev/spa-deployer/CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_API_TOKEN: op://scalev/spa-deployer/CLOUDFLARE_API_TOKEN

      - name: Deploy Worker
        run: |
          max_attempts=4

          for attempt in $(seq 1 "$max_attempts"); do
            log_file=$(mktemp)
            set +e
            pnpm run deploy 2>&1 | tee "$log_file"
            deploy_status=${PIPESTATUS[0]}
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ] || ! grep -Eq -- '-> 5[0-9]{2} ' "$log_file"; then
              rm -f "$log_file"
              exit "$deploy_status"
            fi

            delay=$((attempt * 20))
            echo "::warning::Cloudflare API returned a 5xx response; retrying deploy in ${delay}s (attempt $((attempt + 1))/${max_attempts})."
            rm -f "$log_file"
            sleep "$delay"
          done
      # After a successful deploy, persist the regenerated catalog back
      # to main so the next Deploy run sees no drift. Pushing happens
      # AFTER deploy so a failing deploy never lands a "synced" commit
      # on main without the corresponding Worker bundle being live.
      # The push is authenticated with GITHUB_TOKEN, which intentionally
      # does NOT re-trigger this workflow — that's fine, because the
      # current run already deployed the same catalog.
      - name: Persist synced catalogs back to main
        if: steps.drift.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/v3Catalog.ts src/generated/docsCatalog.ts
          git commit -m "Sync generated MCP catalogs (auto)"
          git push
          echo "::notice::Regenerated catalog persisted to main."
