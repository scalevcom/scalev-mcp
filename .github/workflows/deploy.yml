name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: nexus-mcp

      - name: Checkout api-openapi
        uses: actions/checkout@v4
        with:
          repository: scalevcom/api-openapi
          ref: main
          path: api-openapi

      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          repository: scalevcom/docs
          ref: main
          path: docs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nexus-mcp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated catalog sync
        run: pnpm run check:catalogs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Deploy Worker
        run: pnpm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
